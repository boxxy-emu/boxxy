name: Android

# Builds the release APK, the way a developer machine does (CLAUDE.md):
# vcpkg libraries, the Meson core (rebuild_meson.sh), then Gradle.  Linux:
# the NDK, vcpkg, Meson and Gradle all run there, and GitHub's macOS runners
# were too scarce to be dependable (a job went unscheduled, 2026-11-10).
#
# Pushing a boxxy-v<version> tag also signs the APK with the release key
# (secrets BOXXY_KEYSTORE_BASE64 and BOXXY_KEYSTORE_PASSWORD, made with
# android/tools/make-release-key.sh) and creates a *draft* GitHub release with
# the APK, its checksum and update.json (read by the app's update check).
# Publishing the draft is left to a person.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write         # the draft release, on tag builds only
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/boxxy-v') }}
      NDK_VERSION: 29.0.14206865
      VCPKG_COMMIT: 26283ac5e8a068561a718ce18b169bfad84c7dab
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # history and tags: the version comes from git

      - name: Check out libadrenotools
        run: git submodule update --init --recursive android/app/libs/libadrenotools

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk space
        # vcpkg, the core build and Gradle need more than a fresh runner has
        # free; drop toolchains this build never uses (not the Android SDK).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
              /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
              /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential ninja-build pkg-config autoconf autoconf-archive \
              automake libtool bison flex gperf curl zip unzip tar
          # Ubuntu's Meson is too old (the build needs >= 1.5).
          pipx install meson==1.10.1
          # Meson runs the build's Python generators with its own interpreter;
          # gen_config.py (xemu-config.h) imports yaml.
          pipx inject meson pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;$NDK_VERSION" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ env.NDK_VERSION }}-${{ hashFiles('vcpkg-overlay-ports/**', 'android/tools/vcpkg-deps.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ env.NDK_VERSION }}-

      - name: Build vcpkg libraries
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          android/tools/vcpkg-deps.sh

      - name: Build the core (Meson)
        run: ./rebuild_meson.sh

      - name: Release signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.BOXXY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOXXY_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Release tag, but the signing secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boxxy-release.jks"
          echo "BOXXY_RELEASE_STORE_FILE=$RUNNER_TEMP/boxxy-release.jks" >> "$GITHUB_ENV"
          echo "BOXXY_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build the APK (Gradle)
        working-directory: android
        run: |
          # Releases are built as users get them: not debuggable.
          extra=()
          [[ "$IS_RELEASE" == true ]] && extra=(-PreleaseDebuggable=false)
          ./gradlew assembleRelease --no-daemon "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: boxxy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Draft the GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#boxxy-v}"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/release/app-release.apk

          # Signed with the release key, not the debug key; version from the tag.
          "$bt/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "DN: CN=Boxxy, O=Boxxy" certs.txt || { echo "::error::not signed with the release key"; exit 1; }
          badging=$("$bt/aapt2" dump badging "$apk" | head -1)
          code=$(echo "$badging" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
          name=$(echo "$badging" | sed -E "s/.*versionName='([^']+)'.*/\1/")
          [[ "$name" == "$version" ]] || { echo "::error::APK version $name, tag $version"; exit 1; }

          out="boxxy-$version.apk"
          cp "$apk" "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          echo "$sha  $out" > "$out.sha256"
          cat > update.json <<EOF
          {"versionName": "$version", "versionCode": $code, "apk": "$out", "sha256": "$sha"}
          EOF

          # release-notes/<version>.md when there is one; edit the draft either way.
          notes="release-notes/$version.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes for Boxxy $version go here." > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          gh release create "$tag" --draft --verify-tag \
              --title "Boxxy $version" \
              --notes-file "$notes" \
              "$out" "$out.sha256" update.json
