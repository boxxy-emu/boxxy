name: Feature Request
description: Suggest something for Boxxy
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please check that it hasn't been requested already.

        Boxxy is an independent Android port of xemu. Ideas for the emulator in general may also suit the xemu project, but please don't send it Boxxy requests.
  - type: textarea
    id: feature-request
    attributes:
      label: The idea
      description: |
        What you would like Boxxy to do, and why. Mockups or screenshots are welcome.

        Tip: you can attach images by clicking this area and dragging files in.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you've considered, or how you work around it today.
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
