name: General Issue
description: A problem with Boxxy that isn't about one particular game
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This template is for problems with the app itself: setup, the library, controls, settings, the dual-screen panel or online play setup.

        Boxxy is an independent Android port of xemu. Please report Boxxy problems here, not to the xemu project.

        Before submitting, please check that this hasn't been reported already.
  - type: textarea
    id: bug-description
    attributes:
      label: What happens
      description: |
        What goes wrong, and the steps to make it happen. Screenshots or a short video help a lot.

        Tip: you can attach images by clicking this area and dragging files in.
      placeholder: |
        The controller stops working after the screen turns off.

        1. Start any game
        2. Let the screen turn off, then wake it
        3. The buttons do nothing until the app is restarted
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What you expected
      placeholder: The controller works again after waking the screen.
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device and Boxxy version
      description: The Boxxy version and your Android version are under Settings → Advanced.
      placeholder: |
        Boxxy version: 1.0
        Device: AYN Thor (Snapdragon 8 Gen 2)
        Android version: 13
        Controller: built-in
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Whether it worked in an earlier Boxxy version, logs, or other details.
